<template>
    <lightning-card>
        <div class="slds-p-around_medium">
            <template if:true={loadError}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <span>{loadError}</span>
                </div>
            </template>

            <template if:true={hasSaveNotice}>
                <div class={saveNoticeClass} role={saveNoticeRole}>
                    <div class="save-notice-content">
                        <strong class="save-notice-title">{saveNotice.title}</strong>
                        <span>{saveNotice.message}</span>
                    </div>
                    <button class="save-notice-close" type="button" onclick={clearSaveNotice} title="Dismiss" aria-label="Dismiss notification">x</button>
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="loading-shell">
                    <lightning-spinner alternative-text="Loading document" size="medium"></lightning-spinner>
                    <div class="loading-message">{loadingMessage}</div>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasSelectedPdf}>
                    <div class="prepare-workspace" style={workspaceStyle}>
                        <aside class="prepare-sidebar" aria-label="E-Signature field tools">
                            <section class="sidebar-section">
                                <div class="sidebar-heading">Fields</div>
                                <div class="palette" aria-label="Available fields">
                                    <template for:each={fieldTypes} for:item="fieldType">
                                        <button
                                            key={fieldType.value}
                                            class="palette-button"
                                            type="button"
                                            draggable="true"
                                            data-field-type={fieldType.value}
                                            ondragstart={handlePaletteDragStart}
                                            onclick={handlePaletteClick}>
                                            {fieldType.label}
                                        </button>
                                    </template>
                                </div>
                            </section>

                            <template if:true={showClickToPlaceMessage}>
                                <div class="sidebar-message" role="status">
                                    Click the document page where you want to place the {pendingFieldTypeLabel} field.
                                </div>
                            </template>

                            <section class="sidebar-section">
                                <div class="sidebar-heading">Zoom</div>
                                <div class="zoom-controls">
                                    <lightning-button-icon icon-name="utility:dash" alternative-text="Zoom out" onclick={handleZoomOut}></lightning-button-icon>
                                    <span class="zoom-label">{zoomPercent}%</span>
                                    <lightning-button-icon icon-name="utility:add" alternative-text="Zoom in" onclick={handleZoomIn}></lightning-button-icon>
                                </div>
                            </section>

                            <section class="field-editor sidebar-section">
                                <div class="sidebar-heading">Selected Field</div>
                                <template if:true={selectedField}>
                                    <lightning-input label="Label" value={selectedField.label} onchange={handleSelectedLabelChange}></lightning-input>
                                    <div class="required-editor">
                                        <lightning-input type="checkbox" label="Required" checked={selectedField.required} onchange={handleSelectedRequiredChange}></lightning-input>
                                    </div>
                                    <div class="selected-help">Drag to move. Use the lower-right handle to resize.</div>
                                </template>
                                <template if:false={selectedField}>
                                    <div class="no-field-selected">Select a field to edit it.</div>
                                </template>
                            </section>

                            <div class="sidebar-actions">
                                <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isSaving}></lightning-button>
                            </div>
                        </aside>

                        <div class="document-shell">
                            <template for:each={pagesWithFields} for:item="page">
                                <section
                                    key={page.pageNumber}
                                    class="page-shell"
                                    data-page-number={page.pageNumber}
                                    ondragover={handlePageDragOver}
                                    ondrop={handlePageDrop}
                                    onclick={handlePageClick}>
                                    <div class="page-label">Page {page.pageNumber}</div>
                                    <img
                                        src={page.renditionUrl}
                                        class="pdf-rendition"
                                        alt={page.altText}
                                        data-page-number={page.pageNumber}
                                        onload={handleRenditionLoad}
                                        onerror={handleRenditionError}
                                    />
                                    <div class="field-layer">
                                        <template for:each={page.fields} for:item="field">
                                            <div
                                                key={field.clientId}
                                                class={field.className}
                                                style={field.style}
                                                data-client-id={field.clientId}
                                                onpointerdown={handleFieldPointerDown}
                                                onclick={handleFieldClick}>
                                                <button
                                                    class="field-delete-button"
                                                    type="button"
                                                    data-client-id={field.clientId}
                                                    onclick={handleFieldDeleteClick}
                                                    onpointerdown={handleFieldDeletePointerDown}
                                                    title="Delete field"
                                                    aria-label="Delete field">x</button>
                                                <span class="field-text">{field.displayLabel}</span>
                                                <span class="resize-handle" data-client-id={field.clientId} onpointerdown={handleResizePointerDown}></span>
                                            </div>
                                        </template>
                                    </div>
                                </section>
                            </template>
                        </div>
                    </div>
                </template>
                <template if:false={hasSelectedPdf}>
                    <div class="empty-state">No PDF was provided. Pass a Content Document Id from Flow to prepare fields.</div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
